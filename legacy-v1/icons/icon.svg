<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#4A90E2"/>
  <g transform="translate(256,240)">
    <!-- Book shape -->
    <path d="M-100,-80 C-100,-80 -10,-70 0,-60 C10,-70 100,-80 100,-80 L100,80 C100,80 10,70 0,60 C-10,70 -100,80 -100,80 Z" fill="white" opacity="0.95"/>
    <!-- Center line -->
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#4A90E2" stroke-width="2"/>
    <!-- Lines on left page -->
    <line x1="-75" y1="-40" x2="-15" y2="-35" stroke="#4A90E2" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="-75" y1="-15" x2="-15" y2="-10" stroke="#4A90E2" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="-75" y1="10" x2="-15" y2="15" stroke="#4A90E2" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <!-- Checkmark on right page -->
    <path d="M25,0 L45,20 L80,-25" fill="none" stroke="#7ED321" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Label -->
  <text x="256" y="380" text-anchor="middle" fill="white" font-family="sans-serif" font-size="42" font-weight="bold">Active</text>
  <text x="256" y="420" text-anchor="middle" fill="white" font-family="sans-serif" font-size="42" font-weight="bold">Reading</text>
</svg>
